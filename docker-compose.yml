services:
  postgres:
    image: postgres:17
    container_name: pickyourepic_postgres
    environment:
      POSTGRES_USER: pickyourepic
      POSTGRES_PASSWORD: pickyourepic
      POSTGRES_DB: pickyourepic_development
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickyourepic"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
